<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot - Restaurante Escola Poliedro</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Botão de toggle do chatbot -->
        <button id="chatbot-toggler" class="chatbot-toggle-btn">
            <span class="material-symbols-rounded open-icon">chat</span>
            <span class="material-symbols-rounded close-icon">close</span>
        </button>
        
        <div class="chatbot-container">
            <!-- Cabeçalho do Chatbot -->
            <div class="chat-header">
                <div class="header-info">
                    <div class="chatbot-logo">
                        <img src="img/logo poliedro.svg" alt="Logo Escola Poliedro" id="escola-logo">
                    </div>
                    <h2 class="logo-text">Restaurante Escola Poliedro</h2>
                </div>
                <button id="close-chatbot" class="material-symbols-rounded">keyboard_arrow_down</button>
            </div>
            
            <!-- Corpo do Chatbot -->
            <div class="chat-body">
                <div class="message bot-message">
                    <div class="bot-avatar">
                        <img src="img/logo pequeno.png" alt="Logo pequeno">
                    </div>
                    <div class="message-text">
                        Olá! Bem-vindo ao Restaurante Escola Poliedro.<br>
                        Como posso ajudar você hoje?
                    </div>
                </div>
                <!-- As mensagens serão adicionadas aqui dinamicamente -->
            </div>
            
            <!-- Rodapé do Chatbot -->
            <div class="chat-footer">
                <div class="chat-options">
                    <button class="option-btn" data-option="cardapio">Ver Cardápio</button>
                    <button class="option-btn" data-option="promocoes">Promoções</button>
                    <button class="option-btn" data-option="horario">Horário de Funcionamento</button>
                    <button class="option-btn" data-option="pedido">Fazer Pedido</button>
                </div>
                <form action="#" class="chat-form">
                    <textarea placeholder="Digite sua mensagem..." class="message-input" required></textarea>
                    <button type="submit" class="send-btn material-symbols-rounded">send</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
